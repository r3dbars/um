name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          echo "==> swift build -c release"
          if [[ -d Um.xcodeproj ]]; then
            echo "Um.xcodeproj found; trying xcodebuild, then falling back to swift build"
            if ! xcodebuild \
              -project Um.xcodeproj \
              -scheme Um \
              -configuration Release \
              -derivedDataPath .build/DerivedData \
              MACOSX_DEPLOYMENT_TARGET=13.0 \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=NO \
              build
            then
              echo "xcodebuild failed; falling back to swift build -c release"
              swift build -c release --product Um
            fi
          else
            echo "No Xcode project; using swift build -c release"
            swift build -c release --product Um
          fi

      - name: Test
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          echo "==> privacy log gate"
          chmod +x scripts/verify-no-public-transcript-logs.sh
          ./scripts/verify-no-public-transcript-logs.sh
          echo "==> swift test"
          swift test
