name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          echo "==> swift build -c release"
          if [[ -d Um.xcodeproj ]]; then
            echo "Um.xcodeproj found; trying xcodebuild, then falling back to swift build"
            if ! xcodebuild \
              -project Um.xcodeproj \
              -scheme Um \
              -configuration Release \
              -derivedDataPath .build/DerivedData \
              MACOSX_DEPLOYMENT_TARGET=13.0 \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=NO \
              build
            then
              echo "xcodebuild failed; falling back to swift build -c release"
              swift build -c release --product Um
            fi
          else
            echo "No Xcode project; using swift build -c release"
            swift build -c release --product Um
          fi

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Test
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          echo "==> swift test"
          set +e
          output="$(swift test 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [[ ${status} -ne 0 ]]; then
            exit "${status}"
          fi
          if printf '%s\n' "${output}" | grep -Eq 'Test Case .+ skipped|Executed 0 tests|no tests to run'; then
            echo "error: tests were skipped or none ran" >&2
            exit 1
          fi
          if ! printf '%s\n' "${output}" | grep -Eq 'Executed [1-9][0-9]* tests'; then
            echo "error: swift test did not execute any tests" >&2
            exit 1
          fi

      - name: Verify no public transcript logs
        run: |
          set -euo pipefail
          chmod +x scripts/verify-no-public-transcript-logs.sh
          ./scripts/verify-no-public-transcript-logs.sh
